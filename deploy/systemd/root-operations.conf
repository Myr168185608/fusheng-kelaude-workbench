# 可选：Root 运维模式（默认不启用）
#
# 这个覆盖文件会：
#   - 设置 WORKBENCH_ROOT_OPERATIONS=1，告诉 Claude 可以按本机 sudo 策略执行特权命令；
#   - 放开 sudo 所需的 setuid 能力，以及修改 /etc、/usr、内核参数的能力。
# 它本身不授予任何 root 权限：Claude 实际能用 sudo 做什么，完全由 /etc/sudoers.d/ 里的规则决定。
# 请只按需授权具体命令（参考 deploy/sudoers/cloud-ops-workbench.example），并先阅读 SECURITY.md。
#
# 安装：
#   sudo mkdir -p /etc/systemd/system/cloud-ops-workbench.service.d
#   sudo cp deploy/systemd/root-operations.conf /etc/systemd/system/cloud-ops-workbench.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart cloud-ops-workbench
# 撤销：删除该文件后执行同样的 daemon-reload 与 restart。

[Service]
Environment=WORKBENCH_ROOT_OPERATIONS=1
NoNewPrivileges=no
RestrictSUIDSGID=no
ProtectSystem=no
ProtectKernelTunables=no
